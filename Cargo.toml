[package]
name = "barbican"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Authentication and authorization middleware for Axum — extractors, role-based guards, and public path bypass"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/barbican"
keywords = ["auth", "axum", "middleware"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-layer = "0.3"
tower-service = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
pin-project-lite = "0.2"

[dependencies.tokenkit]
version = "0.1.0"
path = "../tokenkit"
optional = true

[[bench]]
name = "barbican_bench"
harness = false

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["extractors", "tokenkit"]
extractors = []
tokenkit = ["dep:tokenkit"]
